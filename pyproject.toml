[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incas"
version = "0.5.0"
description = "INCAS: incremental coverage adsorbate search on catalytic metal surfaces"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2", "ase>=3.26,<4", "acat==2.0.3",
  "autoadsorbate==0.2.5", "mace-torch==0.3.16",
]

[project.scripts]
incas = "incas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
